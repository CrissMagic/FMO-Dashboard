name: Desktop build and signed updates
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish stable GitHub Release and updater manifest
        type: boolean
        default: false
  push:
    branches: [main, codex/fmo-workspace-relay-status]
    tags: ['desktop-v*']
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Validate release version and signing
        id: release
        shell: pwsh
        env:
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish || false }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne $tag) { throw 'Tag must match package.json version' }
          if ($env:PUBLISH -eq 'true' -and !$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY before publishing updates' }
          $signed = [bool]$env:TAURI_SIGNING_PRIVATE_KEY
          @{ bundle = @{ createUpdaterArtifacts = $signed } } | ConvertTo-Json -Compress | Set-Content src-tauri/tauri.ci.conf.json
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($env:PUBLISH)" >> $env:GITHUB_OUTPUT
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Regression checks
        run: |
          npm run test:map
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:relay-switch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:events
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:device-control
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:updates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer and optionally publish signed updates
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.ci.conf.json
          tagName: ${{ steps.release.outputs.publish == 'true' && steps.release.outputs.tag || '' }}
          releaseName: FMO Desktop v__VERSION__
          releaseBody: 'Windows x64 安装包。应用内通过“更多 → 软件更新”检查并安装签名更新。'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ steps.release.outputs.signed }}
          updaterJsonPreferNsis: true
      - uses: actions/upload-artifact@v4
        with:
          name: fmo-windows-x64-${{ steps.release.outputs.tag }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          if-no-files-found: error
