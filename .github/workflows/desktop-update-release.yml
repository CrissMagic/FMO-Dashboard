name: Desktop build and signed updates
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing desktop-v tag to publish; leave empty for a build only'
        required: false
        default: ''
        type: string
  push:
    branches: [main, codex/fmo-workspace-relay-status]
    tags: ['desktop-v*']
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Validate release version and signing
        id: release
        shell: pwsh
        env:
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release_tag != '' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne $tag) { throw 'Tag must match package.json version' }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne $tag) { throw 'Release tag must match package.json version' }
          if ($env:PUBLISH -eq 'true') {
            git show-ref --verify "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Push the existing version tag before publishing' }
          }
          if ($env:PUBLISH -eq 'true' -and !$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY before publishing updates' }
          $signed = [bool]$env:TAURI_SIGNING_PRIVATE_KEY
          @{ bundle = @{ createUpdaterArtifacts = $signed } } | ConvertTo-Json -Compress | Set-Content src-tauri/tauri.ci.conf.json
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($env:PUBLISH)" >> $env:GITHUB_OUTPUT
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Regression checks
        run: |
          npm run test:map
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:relay-switch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:events
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:device-control
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:updates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer and optionally publish signed updates
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.ci.conf.json
          tagName: ${{ steps.release.outputs.publish == 'true' && steps.release.outputs.tag || '' }}
          releaseName: FMO Desktop v__VERSION__
          releaseBody: 'Windows x64 安装包。应用内通过“更多 → 软件更新”检查并安装签名更新。'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ steps.release.outputs.signed }}
          updaterJsonPreferNsis: true
          assetNamePattern: FMO-Dashboard_[version]_[platform]_[arch][setup][ext]
      - name: Verify published update manifest
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: pwsh
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern latest.json --dir release-check --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Published release is missing latest.json' }
          $manifest = Get-Content release-check/latest.json | ConvertFrom-Json
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $platform = $manifest.platforms.'windows-x86_64'
          if ($manifest.version -ne $version -or !$platform.signature -or !$platform.url) { throw 'Invalid Windows update manifest' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmo-windows-x64-${{ steps.release.outputs.tag }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          if-no-files-found: error
